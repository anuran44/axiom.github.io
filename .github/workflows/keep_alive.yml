name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */10 * * *' # Runs every 10 hours
  workflow_dispatch: # Allows manual triggering

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Ensures the runner has permissions to push

      - name: Push empty commit
        run: |
          git config --global anuran44 "github-actions[bot]"
          git config --global bhattacharyaanuran45@gmail.com "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep-alive ping to prevent Streamlit hibernation"
          git push
